name: big-data-s3

services:
  redpanda:
    container_name: big-data-s3-redpanda
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://127.0.0.1:${KAFKA_PORT:-9092}
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - redpanda-data:/data
    restart: unless-stopped

  rustfs:
    container_name: big-data-s3-rustfs
    image: rustfs/rustfs:latest
    command: ["--address", ":9000", "--console-address", ":9001", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  iceberg-rest:
    container_name: big-data-s3-iceberg-rest
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${ICEBERG_BUCKET:-iceberg-warehouse}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      # tabulario/iceberg-rest maps __ to "-" in catalog properties; s3.path-style-access requires this spelling.
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:${ICEBERG_PORT:-8181}:8181"
    restart: unless-stopped

  aws-cli:
    container_name: big-data-s3-aws-cli
    image: amazon/aws-cli:2.27.41
    profiles: [tools]
    entrypoint: ["aws"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

  sink:
    container_name: big-data-s3-sink
    build: .
    depends_on:
      - redpanda
      - rustfs
      - iceberg-rest
    command: ["python", "sink.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-opencode}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://${ICEBERG_BUCKET:-iceberg-warehouse}
      ICEBERG_S3_ENDPOINT: http://rustfs:9000
      ICEBERG_S3_PATH_STYLE_ACCESS: "true"
    restart: unless-stopped

  dashboard:
    container_name: big-data-s3-dashboard
    build: .
    profiles: [dashboard]
    depends_on:
      - rustfs
      - iceberg-rest
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://${ICEBERG_BUCKET:-iceberg-warehouse}
      ICEBERG_S3_ENDPOINT: http://rustfs:9000
      ICEBERG_S3_PATH_STYLE_ACCESS: "true"

  spark:
    container_name: big-data-s3-spark
    image: apache/spark:3.5.6-python3
    profiles: [spark]
    depends_on:
      - rustfs
      - iceberg-rest
    working_dir: /opt/opencode
    volumes:
      - .:/opt/opencode
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://${ICEBERG_BUCKET:-iceberg-warehouse}
      ICEBERG_S3_ENDPOINT: http://rustfs:9000
      ICEBERG_S3_PATH_STYLE_ACCESS: "true"
      SPARK_OUTPUT: s3a://${ICEBERG_BUCKET:-iceberg-warehouse}/spark
    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.hadoop:hadoop-aws:3.3.4,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:${ICEBERG_SPARK_RUNTIME:-1.6.1}
      - spark/analytics.py

volumes:
  rustfs-data:
  redpanda-data:
